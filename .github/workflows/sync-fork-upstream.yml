name: Sync Fork Multi-Branch

on:
  schedule:
    # Run sync daily at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Specific branch to sync (leave empty for all default branches)'
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Download every branch and full history

      - name: Synchronize Branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add upstream remote defensively
          git remote add upstream https://github.com/t2linux/linux-t2-patches.git 2>/dev/null || git remote set-url upstream https://github.com/t2linux/linux-t2-patches.git
          git fetch upstream

          if [ -n "${{ github.event.inputs.target_branch }}" ]; then
            BRANCHES=("${{ github.event.inputs.target_branch }}")
          else
            BRANCHES=("main" "6.18" "7.1")
          fi

          FAILED_BRANCHES=()

          for BRANCH in "${BRANCHES[@]}"; do
            echo "----------------------------------------"
            echo "Synchronizing branch: $BRANCH"
            echo "----------------------------------------"
            
            if ! git rev-parse --verify --quiet "upstream/$BRANCH" >/dev/null; then
              echo "::error::Branch $BRANCH does not exist on upstream"
              FAILED_BRANCHES+=("$BRANCH")
              continue
            fi
            
            if git rev-parse --verify --quiet "origin/$BRANCH" >/dev/null; then
              # Branch exists on origin: rebase local commits on top of upstream
              git checkout -B "$BRANCH" "origin/$BRANCH"
              if ! git rebase "upstream/$BRANCH"; then
                echo "::error::Rebase of $BRANCH on upstream/$BRANCH failed (conflict)"
                git rebase --abort 2>/dev/null || true
                FAILED_BRANCHES+=("$BRANCH")
                continue
              fi
            else
              # New branch on upstream only: create directly
              git checkout -B "$BRANCH" "upstream/$BRANCH"
            fi
            
            if ! git push --force-with-lease origin "$BRANCH"; then
              echo "::error::Failed to push branch $BRANCH to origin"
              FAILED_BRANCHES+=("$BRANCH")
              continue
            fi
          done

          if [ ${#FAILED_BRANCHES[@]} -ne 0 ]; then
            echo "::error::Synchronization failed for branches: ${FAILED_BRANCHES[*]}"
            exit 1
          fi


