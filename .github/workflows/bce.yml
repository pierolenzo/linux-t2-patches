---
name: t2bce update

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message'
        required: false
      fork:
        description: 'Link to any fork if needed'
        required: false
      branch:
        description: 'Any specific branch to be cloned'
        required: false
jobs:
  Publish-Mainline:
    runs-on: ubuntu-latest
    steps:

      - name: 'Checkout Repo'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Get the latest driver
        id: publish
        run: |
          source ${{ github.workspace }}/version
          echo "kver=${KVER}" >> $GITHUB_ENV
          patch_driver="${{ github.workspace }}/1001-Add-t2bce-driver-stack.patch"
          patch_integration="${{ github.workspace }}/1002-Integrate-t2bce-driver-stack.patch"
          if [ -e "$patch_driver" ] || [ -e "$patch_integration" ]; then
          rm $patch_driver $patch_integration
          fi

          FORK="${{ github.event.inputs.fork }}"
          if [ -z "$FORK" ]; then
            FORK="${{ vars.FORK }}"
          fi
          if [ -z "$FORK" ]; then
            FORK='https://github.com/pierolenzo/t2bce'
          fi
          BRANCH="${{ github.event.inputs.branch }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="${{ vars.BRANCH }}"
          fi
          git clone --depth 1 --single-branch --branch "v${KVER}" https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          if [ -z "$BRANCH" ]; then
            git clone $FORK ${{ github.workspace }}/t2bce-source
          else
            git clone --branch $BRANCH $FORK ${{ github.workspace }}/t2bce-source
          fi
          ${{ github.workspace }}/t2bce-source/generate-kernel-patches.sh \
            ${{ github.workspace }}/linux-stable ${{ github.workspace }}

          T2BCE_DIR="${{ github.workspace }}/t2bce-source"
          T2BCE_FULL_SHA=$(git -C "$T2BCE_DIR" rev-parse HEAD)
          T2BCE_CLEAN_URL="${FORK%.git}"
          T2BCE_CLEAN_URL="${T2BCE_CLEAN_URL%/}"

          KAIT2EN_INFO=""
          if [ -f "$T2BCE_DIR/.upstream_kait2en_commit" ]; then
            KAIT2EN_SHA=$(cut -c1-7 "$T2BCE_DIR/.upstream_kait2en_commit")
            KAIT2EN_INFO="KaiT2en-Fedora baseline: https://github.com/kaiT2en/KaiT2en-Fedora/commit/${KAIT2EN_SHA}"
          fi

          # Dynamically extract all new commits since the previous sync
          PREV_T2BCE_SHA=$(git log -1 --grep="Synchronized from:" --format="%B" 2>/dev/null | grep -oE "commit/[0-9a-f]{7,40}" | cut -d/ -f2 | head -n1 || echo "")
          if [ -n "$PREV_T2BCE_SHA" ] && git -C "$T2BCE_DIR" cat-file -e "$PREV_T2BCE_SHA^{commit}" 2>/dev/null; then
            RECENT_COMMITS=$(git -C "$T2BCE_DIR" log --reverse --format="* %h %s (%an)" "${PREV_T2BCE_SHA}..HEAD")
          else
            RECENT_COMMITS=$(git -C "$T2BCE_DIR" log -n 10 --format="* %h %s (%an)")
          fi
          if [ -z "$RECENT_COMMITS" ]; then
            RECENT_COMMITS="* ${T2BCE_FULL_SHA:0:7} Latest drivers sync"
          fi

          MSG="${{ github.event.inputs.commit_message }}"
          if [ -n "$MSG" ]; then
            echo "$MSG" > ${{ github.workspace }}/commit_msg.txt
          else
            cat << EOF > ${{ github.workspace }}/commit_msg.txt
bce: update driver stack for kernel v${KVER}

Synchronized from: ${T2BCE_CLEAN_URL}/commit/${T2BCE_FULL_SHA}
${KAIT2EN_INFO}

Recent driver updates:
${RECENT_COMMITS}

Generated patches:
- 1001-Add-t2bce-driver-stack.patch
- 1002-Integrate-t2bce-driver-stack.patch
EOF
          fi
 
      - name: Cleanup and update the repo
        run: |
          cd ${{ github.workspace }}
          rm -r linux-stable t2bce-source
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            if [ -f commit_msg.txt ]; then
              git commit -F commit_msg.txt
              rm -f commit_msg.txt
            else
              git commit -m "Update t2bce for kernel v${{ env.kver }}"
            fi
          else
            echo "No changes detected in generated patches."
          fi
 
      - name: Push changes to the repo
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
 
  Publish-LTS:
    runs-on: ubuntu-latest
    steps:

      - name: 'Checkout Repo'
        uses: actions/checkout@v7
        with:
          ref: 6.18
          persist-credentials: false
          fetch-depth: 0

      - name: Get the latest driver
        id: publish
        run: |
          source ${{ github.workspace }}/version
          echo "kver=${KVER}" >> $GITHUB_ENV
          patch_driver="${{ github.workspace }}/1001-Add-t2bce-driver-stack.patch"
          patch_integration="${{ github.workspace }}/1002-Integrate-t2bce-driver-stack.patch"
          if [ -e "$patch_driver" ] || [ -e "$patch_integration" ]; then
          rm $patch_driver $patch_integration
          fi

          FORK="${{ github.event.inputs.fork }}"
          if [ -z "$FORK" ]; then
            FORK="${{ vars.FORK }}"
          fi
          if [ -z "$FORK" ]; then
            FORK='https://github.com/pierolenzo/t2bce'
          fi
          BRANCH="${{ github.event.inputs.branch }}"
          if [ -z "$BRANCH" ]; then
            BRANCH="${{ vars.BRANCH }}"
          fi
          git clone --depth 1 --single-branch --branch "v${KVER}" https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
          if [ -z "$BRANCH" ]; then
            git clone $FORK ${{ github.workspace }}/t2bce-source
          else
            git clone --branch $BRANCH $FORK ${{ github.workspace }}/t2bce-source
          fi
          ${{ github.workspace }}/t2bce-source/generate-kernel-patches.sh \
            ${{ github.workspace }}/linux-stable ${{ github.workspace }}

          T2BCE_DIR="${{ github.workspace }}/t2bce-source"
          T2BCE_FULL_SHA=$(git -C "$T2BCE_DIR" rev-parse HEAD)
          T2BCE_CLEAN_URL="${FORK%.git}"
          T2BCE_CLEAN_URL="${T2BCE_CLEAN_URL%/}"

          KAIT2EN_INFO=""
          if [ -f "$T2BCE_DIR/.upstream_kait2en_commit" ]; then
            KAIT2EN_SHA=$(cut -c1-7 "$T2BCE_DIR/.upstream_kait2en_commit")
            KAIT2EN_INFO="KaiT2en-Fedora baseline: https://github.com/kaiT2en/KaiT2en-Fedora/commit/${KAIT2EN_SHA}"
          fi

          # Dynamically extract all new commits since the previous sync
          PREV_T2BCE_SHA=$(git log -1 --grep="Synchronized from:" --format="%B" 2>/dev/null | grep -oE "commit/[0-9a-f]{7,40}" | cut -d/ -f2 | head -n1 || echo "")
          if [ -n "$PREV_T2BCE_SHA" ] && git -C "$T2BCE_DIR" cat-file -e "$PREV_T2BCE_SHA^{commit}" 2>/dev/null; then
            RECENT_COMMITS=$(git -C "$T2BCE_DIR" log --reverse --format="* %h %s (%an)" "${PREV_T2BCE_SHA}..HEAD")
          else
            RECENT_COMMITS=$(git -C "$T2BCE_DIR" log -n 10 --format="* %h %s (%an)")
          fi
          if [ -z "$RECENT_COMMITS" ]; then
            RECENT_COMMITS="* ${T2BCE_FULL_SHA:0:7} Latest drivers sync"
          fi

          MSG="${{ github.event.inputs.commit_message }}"
          if [ -n "$MSG" ]; then
            echo "$MSG" > ${{ github.workspace }}/commit_msg.txt
          else
            cat << EOF > ${{ github.workspace }}/commit_msg.txt
bce: update driver stack for kernel v${KVER}

Synchronized from: ${T2BCE_CLEAN_URL}/commit/${T2BCE_FULL_SHA}
${KAIT2EN_INFO}

Recent driver updates:
${RECENT_COMMITS}

Generated patches:
- 1001-Add-t2bce-driver-stack.patch
- 1002-Integrate-t2bce-driver-stack.patch
EOF
          fi
 
      - name: Cleanup and update the repo
        run: |
          cd ${{ github.workspace }}
          rm -r linux-stable t2bce-source
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            if [ -f commit_msg.txt ]; then
              git commit -F commit_msg.txt
              rm -f commit_msg.txt
            else
              git commit -m "Update t2bce for kernel v${{ env.kver }}"
            fi
          else
            echo "No changes detected in generated patches."
          fi
 
      - name: Push changes to the repo
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: 6.18

  Trigger-Overlay:
    needs: [Publish-Mainline, Publish-LTS]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger t2-overlay update
        run: |
          gh workflow run update-t2gentoo-kernel.yml --repo pierolenzo/t2-overlay
        env:
          GH_TOKEN: ${{ secrets.PAT }}
